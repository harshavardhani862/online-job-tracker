
spring.application.name=job-tracker-backend

server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/job_tracker_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR
razorpay.premium-amount=99900

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Email
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Notification scheduler
app.notification.scheduler-delay-ms=${NOTIFICATION_SCHEDULER_DELAY_MS:30000}

# Gmail tracking
app.mail-tracking.enabled=${MAIL_TRACKING_ENABLED:false}
app.mail-tracking.imap-host=${MAIL_TRACKING_IMAP_HOST:imap.gmail.com}
app.mail-tracking.imap-port=${MAIL_TRACKING_IMAP_PORT:993}
app.mail-tracking.username=${MAIL_TRACKING_USERNAME:}
app.mail-tracking.password=${MAIL_TRACKING_PASSWORD:}
app.mail-tracking.owner-email=${MAIL_TRACKING_OWNER_EMAIL:}
app.mail-tracking.poll-interval-ms=${MAIL_TRACKING_POLL_INTERVAL_MS:60000}

# Gemini
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
